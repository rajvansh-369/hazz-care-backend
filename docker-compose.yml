services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: node-mongo-boilerplate
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] })"
    restart: on-failure

  api:
    build: .
    restart: unless-stopped
    command: ['node', 'src/index.js']
    environment:
      NODE_ENV: production
      PORT: 5000
      SERVICE_NAME: core-service
      MONGODB_URL: mongodb://mongo:27017/node-mongo-boilerplate
      MONGODB_REPLICA_SET: rs0
      # Override every secret at deploy time; this value is a placeholder.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env before composing}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TRUST_PROXY: 1
      LOG_LEVEL: info
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - '5000:5000'

volumes:
  mongo-data:
