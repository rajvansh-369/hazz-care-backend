# HajjCare API behind the host's nginx (the staging VPS). Install BEFORE running certbot:
#
#   sudo cp deploy/nginx/api-staging.healthhub4u.co.uk.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-staging.healthhub4u.co.uk.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-staging.healthhub4u.co.uk
#
# `certbot --nginx` then adds the TLS listeners, the certificate and the port-80 redirect to this
# block. That redirect only ever affects http://; the app is given the https:// base URL and
# follows no redirects, so nothing it calls is redirected.
#
# nginx must pass the API's status codes and JSON bodies through UNTOUCHED. So, on purpose, there
# is no proxy_intercept_errors, no error_page, no try_files, no caching, and no rewrite or return
# rule here: the app renders ANY 404 under /auth as "no account for that email" (even with an
# HTML body), and a 401/403 from /auth/refresh signs the pilgrim out. If the API is down, nginx
# answers its own 502, a 5xx the app treats as retryable.

server {
    # Plain HTTP only until certbot adds 443 (and the redirect). Both address families, like the
    # other sites on this server.
    listen 80;
    listen [::]:80;
    server_name api-staging.healthhub4u.co.uk;

    # The webhook accepts bodies up to 1 MB; nginx's default of 1m would reject some with its own
    # 413 before the API sees them.
    client_max_body_size 2m;

    location / {
        # NO path and NO trailing slash after the port: a URI part on proxy_pass makes nginx
        # rewrite request paths. Without one the request URI is passed exactly as received.
        # 127.0.0.1:5100 is API_HOST_PORT in docker-compose.prod.host-nginx.yml (loopback only).
        proxy_pass http://127.0.0.1:5100;

        # Keep-alive to the upstream; nginx's default is HTTP/1.0.
        proxy_http_version 1.1;

        # The original host, and the client address for the per-IP rate limits. nginx is exactly
        # one proxy hop, so the app runs with TRUST_PROXY=1 and reads the last X-Forwarded-For
        # entry, the one nginx appends; a client cannot spoof it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer than the client's own 15-second receive timeout, so nginx never cuts off a
        # response the client is still waiting for. On a timeout nginx answers 504 (a 5xx).
        proxy_read_timeout 30s;
    }
}
