# LOCAL TEST ONLY — never on the VPS. Proves deploy/nginx/api-staging.healthhub4u.co.uk.conf in
# front of the production stack on a workstation, with the same files the VPS uses
# (docker-compose.prod.yml + docker-compose.prod.host-nginx.yml) plus docker-compose.prod.local.yml
# for placeholder secrets and Mailpit:
#
#   ./deploy/nginx/render-local.sh
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.host-nginx.yml \
#     -f docker-compose.prod.local.yml -f docker-compose.prod.local-nginx.yml up -d --build
#   MAILPIT_URL=http://localhost:8025 npm run contract -- http://localhost:8088/api/v1
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.host-nginx.yml \
#     -f docker-compose.prod.local.yml -f docker-compose.prod.local-nginx.yml down -v
#
# nginx:stable runs the file render-local.sh generated: the committed server block with only the
# upstream (127.0.0.1:5100 -> api:5000, since nginx is a container here, not the host) and
# server_name (-> localhost) changed. Plain HTTP only: TLS is certbot's job on the server.
#
# Its own project name, so it runs beside (and `down -v` never touches) the Caddy local test.
# Mailpit's UI port is LOCAL_MAILPIT_PORT (default 8025) in case that test holds 8025; then pass
# the same port in MAILPIT_URL.

name: hajjcare-local-nginx

services:
  nginx:
    image: nginx:stable
    # Replaces the image's default server, so this block is the only one.
    volumes:
      - ./deploy/nginx/.local/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:${LOCAL_NGINX_PORT:-8088}:80'
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    ports: !override
      - '127.0.0.1:${LOCAL_MAILPIT_PORT:-8025}:8025'
